name: Pull request policy

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  danger:
    name: Danger JS
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check trusted Dangerfile
        id: dangerfile
        run: |
          if [[ -f dangerfile.ts ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Danger JS será ativado após este workflow chegar à branch base.'
          fi

      - name: Check harness approval and policy changes
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > /tmp/changed-files
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.labels[].name' > /tmp/pr-labels
          if [[ -f scripts/danger/require-harness-approval.mjs ]]; then
            node scripts/danger/require-harness-approval.mjs /tmp/changed-files /tmp/pr-labels
          else
            echo '::notice::Gate de aprovação do harness será obrigatório após este workflow chegar à branch base.'
          fi
          if grep -Eq '^(dangerfile\.ts|scripts/danger/)' /tmp/changed-files; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Danger JS não executa alterações da própria política antes do merge.'
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.dangerfile.outputs.available == 'true' &&
          steps.policy.outputs.changed == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install trusted dependencies
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.dangerfile.outputs.available == 'true' &&
          steps.policy.outputs.changed == 'false'
        run: npm ci

      - name: Review pull request policies
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.dangerfile.outputs.available == 'true' &&
          steps.policy.outputs.changed == 'false'
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
        run: npx danger ci
