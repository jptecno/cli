name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Create release and publish package
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released revision
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Remove deprecated npm config
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm config delete always-auth

      - name: Verify tag matches package version
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: >-
          node --input-type=module --eval
          "import packageJson from './package.json' with { type: 'json' }; if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('A tag deve corresponder à versão de package.json'); }"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm ci

      - name: Validate package
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run check

      - name: Inspect package contents
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm pack --dry-run

      - name: Publish with provenance
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm publish --provenance

      - name: Create synchronization pull request
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
        run: |
          git fetch origin main development
          branch="chore/sync-release-${RELEASE_TAG}"

          if [ "$(gh pr list --base development --head "${branch}" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "Pull request de sincronização já existe para ${RELEASE_TAG}."
            exit 0
          fi

          git switch --create "${branch}" origin/main
          git push --set-upstream origin "${branch}"

          cat > /tmp/release-sync-pr.md <<EOF
          ## Resumo

          Sincroniza a release \`${RELEASE_TAG}\` de \`main\` para \`development\`, devolvendo à base de integração o bump de versão e o changelog gerados pelo Release Please durante a publicação.

          - Versão publicada: \`${RELEASE_VERSION}\`
          - GitHub Release: ${RELEASE_URL}
          - npm: \`@jptecno/cli@${RELEASE_VERSION}\`

          ## Alterações

          - \`package.json\`
          - \`package-lock.json\`
          - \`CHANGELOG.md\`
          - \`.release-please-manifest.json\`

          ## Comportamento e compatibilidade

          Sem alteração. A pull request carrega apenas metadados de versão e changelog; nenhum arquivo de \`src/\` é tocado.

          ## Camadas afetadas

          - [ ] \`src/application/\`
          - [ ] \`src/contracts/\`
          - [ ] \`src/adapters/\`
          - [ ] \`src/main.ts\`
          - [x] Configuração, CI ou documentação

          ## Configuração e segurança

          Sem impacto. As alterações em \`package.json\` e \`package-lock.json\` são o bump de versão aplicado pelo Release Please na revisão já publicada; nenhuma dependência é adicionada, removida ou atualizada, e nenhuma credencial é envolvida.

          ## Validação

          - [x] \`npm run check\`
          - [x] \`npm pack --dry-run\` quando houver impacto no pacote
          - [x] Outros comandos ou evidências:

          A revisão sincronizada é exatamente a que foi validada e publicada pelo workflow \`Release Please\`, que executa \`npm run check\`, \`npm pack --dry-run\` e \`npm publish --provenance\` antes de criar esta pull request.

          ## Homologação, release e produção

          - Ambiente de homologação e resultado: Não se aplica, PR para \`development\`.
          - Impacto de produção: Nenhum. A publicação de \`${RELEASE_VERSION}\` já ocorreu; esta pull request apenas realinha \`development\`.
          - Próxima versão esperada (\`fix\` = patch, \`feat\` = minor, ou sem release): sem release.
          - Plano de rollback: Não se aplica, PR para \`development\`.

          ## Checklist

          - [ ] Revisar as alterações de versão e changelog.
          - [ ] Fazer merge em \`development\` após a aprovação.
          EOF

          gh pr create \
            --base development \
            --head "${branch}" \
            --title "chore(release): sincroniza ${RELEASE_TAG} em development" \
            --body-file /tmp/release-sync-pr.md

          gh workflow run ci.yml --ref "${branch}"
