name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Create release and publish package
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released revision
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Remove deprecated npm config
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm config delete always-auth

      - name: Verify tag matches package version
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: >-
          node --input-type=module --eval
          "import packageJson from './package.json' with { type: 'json' }; if (process.env.RELEASE_TAG !== 'v' + packageJson.version) { throw new Error('A tag deve corresponder à versão de package.json'); }"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm ci

      - name: Validate package
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run check

      - name: Publish with provenance
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm publish --provenance

      - name: Create synchronization pull request
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
        run: |
          git fetch origin main development
          branch="chore/sync-release-${RELEASE_TAG}"

          if [ "$(gh pr list --base development --head "${branch}" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "Pull request de sincronização já existe para ${RELEASE_TAG}."
            exit 0
          fi

          git switch --create "${branch}" origin/main
          git push --set-upstream origin "${branch}"

          cat > /tmp/release-sync-pr.md <<EOF
          ## Sincronização de release

          Esta PR sincroniza a release \`${RELEASE_TAG}\` de \`main\` para \`development\`.

          - Versão publicada: \`${RELEASE_VERSION}\`
          - GitHub Release: ${RELEASE_URL}
          - npm: \`@jptecno/cli@${RELEASE_VERSION}\`

          ### Alterações esperadas

          - \`package.json\`
          - \`package-lock.json\`
          - \`CHANGELOG.md\`
          - \`.release-please-manifest.json\`

          ## Validação

          A publicação foi concluída pelo workflow \`Release Please\` com \`npm publish --provenance\`.

          ## Checklist

          - [ ] Revisar as alterações de versão e changelog.
          - [ ] Fazer merge em \`development\` após a aprovação.
          EOF

          gh pr create \
            --base development \
            --head "${branch}" \
            --title "chore(release): sincroniza ${RELEASE_TAG} em development" \
            --body-file /tmp/release-sync-pr.md
