name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: node --input-type=module --eval "import packageJson from './package.json' with { type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + packageJson.version) { throw new Error('A tag deve corresponder à versão de package.json'); }"

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run check

      - name: Publish with provenance
        run: npm publish --provenance
